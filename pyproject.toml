[tool.poetry]
name        = "adsb-near-miss"
version     = "0.1.0"
description = "Real-time ADS-B near-miss detection and airspace congestion analysis"
authors     = []
readme      = "README.md"
packages    = [{include = "src"}]

[tool.poetry.dependencies]
python           = "^3.11"

# Kafka clients (confluent-kafka preferred; kafka-python is fallback)
confluent-kafka  = "^2.3"
kafka-python     = "^2.0"

# Geohash
python-geohash   = "^0.8"

# Schema / validation
pydantic         = "^2.5"

# API layer
fastapi          = "^0.109"
uvicorn          = {extras = ["standard"], version = "^0.27"}

# Storage
redis            = "^5.0"
psycopg2-binary  = "^2.9"
sqlalchemy       = "^2.0"
geoalchemy2      = "^0.14"

# Batch analytics
pyarrow          = "^15.0"

# HTTP client (for OpenSky producer)
httpx            = "^0.27"

# Spark (optional – install separately or via Docker for JVM overhead)
# pyspark        = "^3.5"

[tool.poetry.group.dev.dependencies]
pytest           = "^8.0"
pytest-asyncio   = "^0.23"
locust           = "^2.20"
jupyter          = "^1.0"
matplotlib       = "^3.8"
hdbscan          = "^0.8"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
