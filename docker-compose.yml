services:
  # ──────────────────────────────────────────────
  # Kafka (KRaft mode – no Zookeeper)
  # ──────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: adsb-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Cluster
      CLUSTER_ID: "adsb-near-miss-cluster-001"

      # Topic defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Log retention — 6 GB total cap (1 GB per partition × 6 partitions)
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 268435456
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # PostgreSQL + PostGIS
  # ──────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: adsb-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adsb}
      POSTGRES_USER: ${POSTGRES_USER:-adsb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adsb_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-adsb} -d ${POSTGRES_DB:-adsb}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Redis (live state + alerts)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: adsb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Kafka topic initialisation — runs once, then exits.
  # Creates adsb.raw and adsb.dlq so that Spark never
  # subscribes to a topic whose partition leaders haven't
  # been elected yet (the root cause of the
  # "This server does not host this topic-partition" error).
  # ──────────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: adsb-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        echo "Creating Kafka topics…"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic adsb.raw --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic adsb.dlq --partitions 1 --replication-factor 1
        echo "Topics ready:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  # ──────────────────────────────────────────────
  # Spark – near-miss streaming job (local[2] mode)
  # ──────────────────────────────────────────────
  spark:
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    container_name: adsb-spark
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://${POSTGRES_USER:-adsb}:${POSTGRES_PASSWORD:-adsb_secret}@postgres:5432/${POSTGRES_DB:-adsb}
      REDIS_URL: redis://redis:6379/0
      PARQUET_PATH: /app/data/events
      CHECKPOINT_PATH: /app/data/checkpoints
    volumes:
      - ./src:/app/src:ro
      - spark-data:/app/data
      - ivy-cache:/tmp/.ivy2
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - spark-submit
      - --master
      - local[2]
      - --packages
      - "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.spark:spark-token-provider-kafka-0-10_2.12:3.5.1,org.apache.commons:commons-pool2:2.11.1"
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.driver.memory=1g
      - --conf
      - spark.sql.adaptive.enabled=false
      - --conf
      - spark.ui.showConsoleProgress=false
      - /app/src/processing/spark_streaming_job.py
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "pgrep", "-f", "spark_streaming_job"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ──────────────────────────────────────────────
  # FastAPI — near-miss query & live-traffic API
  # ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    container_name: adsb-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-adsb}:${POSTGRES_PASSWORD:-adsb_secret}@postgres:5432/${POSTGRES_DB:-adsb}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src:ro
      - ./frontend:/app/frontend:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  spark-data:
  ivy-cache:
