# Redis configuration for ADS-B Near-Miss Detection
# Optimized for live state caching with short TTLs

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (lightweight – Redis is a cache here, not source of truth)
save 900 1
save 300 10
appendonly no

# Logging
loglevel notice
